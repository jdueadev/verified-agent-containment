name: release

# The release gate. A release is a tag for which this workflow is green: every
# claim is fresh (no file a claim lists has changed since a passing lab run),
# the evidence is linked to committed artifacts, and the standing rules hold.
# The guarantees in README.md and docs/claims.md are made for such tags, not
# for every commit on main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Standing rules
        run: |
          python3 tools/policy_check.py invariants
          python3 tools/pins_check.py drift

      - name: Every claim is fresh at this tag
        run: python3 tools/claims_check.py --strict
