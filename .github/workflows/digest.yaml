name: digest

# After-the-fact audit of merges to main (tools/merge_digest.py).
#
# detective (#71): on every push to main, each first-parent commit the push
#   added is checked with the tools as they were BEFORE the push, so a
#   merged change cannot judge itself. An alert (a lane C change without
#   the owner's approval of the merged head, content that differs from the
#   approved head, a commit with no pull request, a force-push) fails the
#   job and opens an issue that mentions the owner.
# weekly (#54): every Monday, and on demand, one issue labelled
#   `merge-digest` is opened or updated with the week's merges. Only issues
#   this workflow authored are updated; the digest is a convenience, the
#   detective's failures are the record.
#
# It reads pull requests and reviews through the API and runs no repository
# code beyond the trusted checkers in tools/.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detective:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit this push added
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
          OWNER: ${{ github.repository_owner }}
        # Any failure in this step, an alert or a crash, fails the job, and the
        # next step then opens the issue. A crash is never a silent pass.
        run: |
          report="$RUNNER_TEMP/report.md"
          : > "$report"
          if [ "$FORCED" = "true" ]; then
            printf '**main was force-pushed** (%s to %s).\n\n' "$BEFORE" "$AFTER" >> "$report"
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # An all-zero BEFORE (main created or recreated), or an old head that a
            # force-push made unreachable: there is no trusted judge to run.
            printf 'The commit before this push (%s) is not in the history, so nothing could judge %s.\n' \
              "$BEFORE" "$AFTER" >> "$report"
            exit 1
          fi
          judge="$RUNNER_TEMP/judge"
          git worktree add -q --detach "$judge" "$BEFORE"
          if [ ! -f "$judge/tools/merge_digest.py" ]; then
            if [ -z "$(git log -1 --format=%H "$BEFORE" -- tools/merge_digest.py)" ]; then
              echo "The commit before this push predates merge_digest.py; nothing to judge with."
              [ "$FORCED" = "true" ] && exit 1
              exit 0
            fi
            printf 'tools/merge_digest.py was deleted before %s, so nothing could judge %s.\n' \
              "$BEFORE" "$AFTER" >> "$report"
            exit 1
          fi
          python3 -I "$judge/tools/merge_digest.py" collect --repo "$REPO" \
            --range "$BEFORE..$AFTER" > "$RUNNER_TEMP/merges.json"
          code=0
          python3 -I "$judge/tools/merge_digest.py" report "$RUNNER_TEMP/merges.json" \
            --fail-on-unapproved --title "Merge check for ${AFTER:0:7}" \
            >> "$report" || code=$?
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] || [ "$FORCED" = "true" ]; then
            exit 1
          fi
      - name: Open an alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AFTER: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report.md"
          {
            echo "@$OWNER: the merge check on \`main\` failed for \`${AFTER:0:7}\`. Run: $RUN"
            echo
            if [ -s "$report" ]; then
              head -c 60000 "$report"
              [ "$(wc -c < "$report")" -gt 60000 ] && printf '\n\n(Truncated; the run summary has the rest.)\n'
            else
              echo "The check crashed before it wrote a report. Treat this as an alert until the run log says otherwise."
            fi
          } > "$RUNNER_TEMP/alert.md"
          gh issue create --repo "$REPO" --title "Merge alert: ${AFTER:0:7}" \
            --body-file "$RUNNER_TEMP/alert.md"
          fi

  weekly:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Open or update the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          week="$(date -u +%G-W%V)"
          title="Merge digest $week"
          python3 -I tools/merge_digest.py collect --repo "$REPO" \
            --since "8 days ago" > "$RUNNER_TEMP/merges.json"
          code=0
          python3 -I tools/merge_digest.py report "$RUNNER_TEMP/merges.json" \
            --title "$title" > "$RUNNER_TEMP/digest.md" || code=$?
          if [ "$code" -ne 0 ]; then
            # Without --fail-on-unapproved a non-zero exit is a crash: say so in the digest.
            printf '\n**The digest crashed (exit %s); this report may be incomplete.** Run: %s/%s/actions/runs/%s\n' \
              "$code" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/digest.md"
          fi
          head -c 60000 "$RUNNER_TEMP/digest.md" > "$RUNNER_TEMP/digest.post.md"
          mv "$RUNNER_TEMP/digest.post.md" "$RUNNER_TEMP/digest.md"
          cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
          gh label create merge-digest --repo "$REPO" --force \
            --description "Weekly audit of merges to main" >/dev/null
          number="$(gh issue list --repo "$REPO" --label merge-digest \
            --author app/github-actions --state open \
            --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" \
              --body-file "$RUNNER_TEMP/digest.md"
          else
            gh issue create --repo "$REPO" --label merge-digest \
              --title "$title" --body-file "$RUNNER_TEMP/digest.md"
          fi
