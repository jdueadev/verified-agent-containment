name: container

on:
  pull_request:
    paths:
      - ci/factory.Dockerfile
      - ci/factory.Dockerfile.dockerignore
      - ci/pins.env
      - rust-toolchain.toml
      - Cargo.lock
      - scripts/factory.sh
      - .github/workflows/container.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - scripts/check.sh
      - scripts/verdict.sh
      - scripts/kani.sh
      - scripts/build-page.sh
      - scripts/page-check.sh
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build the check, proofs, dev and page images
        id: images
        run: scripts/factory.sh build check proofs dev page

      - name: Tool versions in the check image, which has no Lean
        run: docker run --rm vac-factory:check bash -euo pipefail -c 'cargo --version; rustup target list --installed; bun --version; node --version; java -version; uv --version; uv run --no-project python --version; command -v bend; wasm-opt --version; wasm2js --version; shellcheck --version; cargo-deny --version; if command -v python3; then echo "the check image contains a system python3" >&2; exit 1; fi; if command -v lean; then echo "the check image contains Lean" >&2; exit 1; fi'

      - name: Tool versions in the proofs and dev images
        run: |
          docker run --rm vac-factory:proofs bash -euo pipefail -c 'bun --version; lean --version; command -v bend; for tool in java gcc python3; do if command -v "$tool"; then echo "the proofs image contains $tool" >&2; exit 1; fi; done'
          docker run --rm vac-factory:dev bash -euo pipefail -c 'cargo --version; lean --version; gh --version'

      - name: Run the checks in the image, with no network
        run: docker run --rm --network=none -e CARGO_NET_OFFLINE=true -v "$PWD:/work" vac-factory:check scripts/check.sh

      - name: Lean recheck in the proofs image
        run: docker run --rm -v "$PWD:/work" vac-factory:proofs scripts/verdict.sh

      # On both architectures: the page each one builds must be the committed page.
      - name: Build and drive the simulator page in the page image, with no network
        run: docker run --rm --network=none -e CARGO_NET_OFFLINE=true -v "$PWD:/work" vac-factory:page scripts/page-check.sh

      # The kani image is built on top of the check image built above, so this
      # step's time is the Kani stage's. It runs even when a check above failed.
      - name: Build the kani image, and print its build time and size
        id: kani-image
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: |
          start=$SECONDS
          scripts/factory.sh build kani
          seconds=$((SECONDS - start))
          check=$(docker image inspect --format '{{.Size}}' vac-factory:check)
          kani=$(docker image inspect --format '{{.Size}}' vac-factory:kani)
          {
            echo "kani stage build on ${{ matrix.runner }}: ${seconds}s"
            echo "check image: ${check} bytes"
            echo "kani image: ${kani} bytes, $((kani - check)) bytes more than check"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          docker image ls vac-factory
          docker run --rm --network=none vac-factory:kani cargo kani --version

      - name: Kani proofs of admission in the kani image, with no network
        if: ${{ !cancelled() && steps.kani-image.outcome == 'success' }}
        run: scripts/factory.sh kani

  publish:
    if: github.repository_owner == 'vac-dev-team' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      REGISTRY_IMAGE: ghcr.io/vac-dev-team/vac-factory
      ARCH: ${{ matrix.arch }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the check, proofs, kani, dev and page images
        run: scripts/factory.sh build

      - name: Push the images for this architecture
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          for stage in check proofs kani dev page; do
            docker tag "vac-factory:$stage" "$REGISTRY_IMAGE:$stage-$ARCH"
            docker push "$REGISTRY_IMAGE:$stage-$ARCH"
          done

  manifest:
    needs: publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REGISTRY_IMAGE: ghcr.io/vac-dev-team/vac-factory
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - name: Publish the multi-architecture images and print their digests
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          for stage in check proofs kani dev page; do
            docker buildx imagetools create -t "$REGISTRY_IMAGE:$stage" "$REGISTRY_IMAGE:$stage-amd64" "$REGISTRY_IMAGE:$stage-arm64"
            docker buildx imagetools inspect "$REGISTRY_IMAGE:$stage" --format '{{.Name}}@{{.Manifest.Digest}}'
            echo
          done
