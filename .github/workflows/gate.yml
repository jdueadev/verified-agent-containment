name: gate

# Posts the gate/* check runs that the main ruleset is to require instead of
# check, spec and policy (#137, stage 2). Those are posted as GitHub Actions,
# which any workflow on any branch can impersonate. gate/* are posted only by
# the gate App, whose key is in the `gate` environment that only main can
# deploy to.
#
# workflow_run always takes this file from the default branch, whatever the
# triggering run was, so a pull request cannot change how it is judged here.
# The verdict rules are in tools/gate_check.py.
#
# Two jobs, so the key never shares a job with pull request data: `judge` has
# no secret and only reads (it fetches the pull request's commits to list the
# paths it changes, and runs none of them). `post` holds the key and only
# writes the verdicts `judge` produced, after checking their shape.

on:
  workflow_run:
    workflows: [check, spec, policy, policy-refresh]
    types: [completed]

permissions:
  contents: read

concurrency:
  # One judgement per head commit at a time. A newer trigger waits, then judges
  # afresh, so the last one to run sees every result.
  group: gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verdicts: ${{ steps.judge.outputs.verdicts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Judge the head commit
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/gate_check.py judge --head-sha "$HEAD_SHA" --out "$GITHUB_OUTPUT"

  post:
    needs: judge
    if: needs.judge.outputs.verdicts != ''
    environment: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: App token, checks only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Post the verdicts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ vars.GATE_APP_ID }}
          VERDICTS: ${{ needs.judge.outputs.verdicts }}
        run: python3 tools/gate_check.py post --app-id "$APP_ID"
