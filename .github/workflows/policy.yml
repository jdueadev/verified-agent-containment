name: policy

# Decides which merge lane a pull request is in (ci/lanes.toml) and whether it
# needs the maintainer. The classifier always comes from the base branch, and
# it only reads the pull request's files through git, so a pull request cannot
# reclassify itself and none of its code runs here.
#
# Until the repository variable POLICY_ENFORCE is "true" the job reports the
# lane and passes. With it on, a lane C change needs the maintainer's approval
# of the head unless its author is on the `trusted` list in the base branch's
# ci/lanes.toml (#206); a fork always needs it. The author comes from the event,
# never from the pull request's text. Only an approval submitted after the head
# arrived counts (#149): GitHub moves an old approval's commit_id onto a new
# head, which let #79, #93 and #101 merge on approvals of earlier heads.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's tip now, not the event's base.sha: a re-run (policy-refresh) replays
          # the old event, and would judge with the rules and trusted list of that day.
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the change
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ENFORCE: ${{ vars.POLICY_ENFORCE }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Only a pull request into main is classified by main's checker. One aimed at
          # another branch would run that branch's copy, so it fails here instead.
          if [ "$BASE_REF" != "main" ]; then
            echo "policy: only pull requests into main are classified (base is '$BASE_REF')." >&2
            exit 1
          fi
          BASE_SHA="$(git rev-parse HEAD)"
          if [ ! -f tools/policy_check.py ]; then
            echo "The base branch has no policy check yet; nothing to classify."
            exit 0
          fi
          git fetch --quiet origin "pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          # Reviews come oldest first, so every page is needed to see the latest one.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
          # Keep only approvals submitted after this head arrived (#149), as the gate does.
          # A fork's head is not in this repository's activity log, so freshness would void
          # every review of a fork; a fork keeps the plain commit_id rule and the maintainer merges it.
          if [ "$FORK" != "true" ] && grep -q -- '"fresh-reviews"' tools/policy_check.py; then
            ref="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote("refs/heads/" + sys.argv[1], safe=""))' "$HEAD_REF")"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/activity?per_page=100&ref=$ref" > "$RUNNER_TEMP/activity.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/timeline?per_page=100" > "$RUNNER_TEMP/timeline.json"
            python3 tools/policy_check.py fresh-reviews --head-sha "$HEAD_SHA" --reviews "$RUNNER_TEMP/reviews.json" \
              --activity "$RUNNER_TEMP/activity.json" --pr "$RUNNER_TEMP/pr.json" --timeline "$RUNNER_TEMP/timeline.json" \
              > "$RUNNER_TEMP/fresh-reviews.json"
            mv "$RUNNER_TEMP/fresh-reviews.json" "$RUNNER_TEMP/reviews.json"
          fi
          # The diff and ratchets start from the merge base; the lane map is the target branch's current one.
          args=(classify --base "$base" --map-ref "$BASE_SHA" --head "$HEAD_SHA" --reviews "$RUNNER_TEMP/reviews.json" --head-sha "$HEAD_SHA")
          if [ "$FORK" = "true" ]; then args+=(--fork); fi
          if grep -q -- '"--author"' tools/policy_check.py; then args+=(--author "$AUTHOR"); fi
          if [ "$ENFORCE" = "true" ]; then args+=(--enforce); fi
          # Run the classifier in this shell, not inside a pipeline, so its exit status survives.
          code=0
          python3 tools/policy_check.py "${args[@]}" > "$RUNNER_TEMP/policy.json" || code=$?
          { echo '```json'; cat "$RUNNER_TEMP/policy.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Invariants of the head, checked by the base branch's checker
        # Runs even when the lane step failed for want of an approval.
        if: ${{ !cancelled() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The rules that hold on every commit (kernel purity, sabotage off by default,
          # CODEOWNERS = lane C). Until #125 only check.sh ran them, from the head's own
          # copy. A failure here is not cleared by an approval.
          # Probe the file, not a run of it: a checker that crashes must fail this step, not skip it.
          if ! grep -q -- '"--ref"' tools/policy_check.py; then
            echo "The base branch's checker cannot read a ref yet; check.sh still runs the invariants."
            exit 0
          fi
          git fetch --quiet origin "pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          # Not in a pipeline, so the checker's exit status survives.
          code=0
          python3 tools/policy_check.py invariants --ref "$HEAD_SHA" > "$RUNNER_TEMP/invariants.json" || code=$?
          { echo '```json'; cat "$RUNNER_TEMP/invariants.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Workflow lint of the head, by the base branch's lint
        # Secrets only in main-only environments, and no event text in scripts (#137).
        # The allowlist comes from this base checkout, so a pull request cannot add to it.
        if: ${{ !cancelled() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Probe the file, not a run of it: a lint that crashes must fail this step, not skip it.
          if [ ! -f tools/workflow_lint.py ]; then
            echo "The base branch has no workflow lint yet."
            exit 0
          fi
          git fetch --quiet origin "pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          # Not in a pipeline, so the lint's exit status survives.
          code=0
          python3 tools/workflow_lint.py --ref "$HEAD_SHA" > "$RUNNER_TEMP/workflow-lint.json" || code=$?
          { echo '```json'; cat "$RUNNER_TEMP/workflow-lint.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
