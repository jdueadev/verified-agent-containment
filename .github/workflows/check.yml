name: check

# Splits fast per-push verification from the merge-time lab freshness gate:
# - `check` runs on every push (including Draft PRs): Bend proofs, Rust/WASM
#   tests and clippy for both feature sets, differential, mutation, TLA+,
#   tooling tests, and non-strict claims_check.py (CI-1/2/3/5/6/7 + stale warnings).
# - `evidence-freshness` runs on Ready PRs and pushes to main: enforces
#   claims_check.py --strict (fresh lab evidence, regenerated docs/claims.md,
#   dual-binary stamps, and full unwaived attack-suite runs).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tool versions are not written here: Rust is pinned in rust-toolchain.toml and
  # everything else in ci/pins.env, which the first step loads.
  TLA2TOOLS: /opt/tla/tla2tools.jar

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # spec.yml and policy.yml judge only pull requests into main; so does this.
      # A PR into a planted branch would otherwise run that branch's scripts and
      # post a green `check` on a head commit also proposed to main (#136). It
      # fails rather than skips: a skipped required check counts as passing.
      - name: Only pull requests into main
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "check: only pull requests into main are judged (base is '$BASE_REF')." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tools/claims_check.py diffs each claim's files against its
          # recorded platform commit, so it needs the full history.
          fetch-depth: 0

      - name: Load pins
        run: grep -E '^[A-Z0-9_]+=' ci/pins.env >> "$GITHUB_ENV"

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustc --version
          python3 tools/pins_check.py drift --rustc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Bend (pinned)
        run: |
          git clone --quiet https://github.com/bendlang/bend "$RUNNER_TEMP/bend"
          git -C "$RUNNER_TEMP/bend" checkout --quiet "$BEND_COMMIT"
          test "$(git -C "$RUNNER_TEMP/bend" rev-parse HEAD)" = "$BEND_COMMIT"
          printf '#!/bin/sh\nexec bun %s/bend/bend2/main.ts "$@"\n' "$RUNNER_TEMP" | sudo tee /usr/local/bin/bend >/dev/null
          sudo chmod +x /usr/local/bin/bend

      - name: TLA+ tools (pinned, checksum verified)
        run: |
          sudo mkdir -p /opt/tla
          sudo curl -fsSL -o "$TLA2TOOLS" "https://github.com/tlaplus/tlaplus/releases/download/$TLA_VERSION/tla2tools.jar"
          echo "$TLA_SHA256  $TLA2TOOLS" | sha256sum --check

      # scripts/check.sh skips TLC silently when java or the jar is missing.
      # In CI a skip would read as a pass, so require every tool up front.
      - name: Require every tool check.sh uses
        run: |
          for tool in cargo bend bun node python3 java; do
            command -v "$tool" >/dev/null || { echo "::error::missing $tool"; exit 1; }
          done
          test -f "$TLA2TOOLS" || { echo "::error::missing $TLA2TOOLS"; exit 1; }

      - name: scripts/check.sh --no-strict
        run: bash scripts/check.sh --no-strict

  # Proof of this run's base for the gate (#137, stage 2). A job of its own, so the
  # OIDC permission never reaches a job that runs the head's code. GitHub sets the
  # token's base_ref, ref, run_id and workflow_ref claims from the event, so a run on a
  # pull request into another branch cannot claim main. tools/gate_check.py verifies it.
  gate-attestation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mint the proof
        id: mint
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            # A fork's pull request gets no OIDC token. The gate does not count its runs.
            echo "No OIDC token for this run."
            exit 0
          fi
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gate" > "$RUNNER_TEMP/oidc.json"
          python3 - "$RUNNER_TEMP/oidc.json" "$RUNNER_TEMP/gate-attestation.jwt" <<'PY'
          import base64, json, sys
          token = json.load(open(sys.argv[1]))["value"]
          open(sys.argv[2], "w").write(token)
          body = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
          # The claims, never the token, so the log shows what the gate will check.
          keys = ("repository", "event_name", "ref", "base_ref", "head_ref", "run_id", "run_attempt", "workflow_ref")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          PY
          rm -f "$RUNNER_TEMP/oidc.json"
          echo "minted=true" >> "$GITHUB_OUTPUT"

      - name: Keep the proof for the gate
        if: steps.mint.outputs.minted == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-attestation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-attestation.jwt
          if-no-files-found: error
          retention-days: 30

  evidence-freshness:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Only pull requests into main
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "check: only pull requests into main are judged (base is '$BASE_REF')." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Checks committed evidence in a clean checkout. Changes to formal/ specs
      # or host sources must commit their updated results/ artifacts (e.g.
      # results/formal-verdict.json, results/tla-check.json, lab suites) before
      # marking a PR Ready for Review; see docs/verification.md.
      - name: Strict claims and evidence freshness gate
        run: python3 tools/claims_check.py --strict
