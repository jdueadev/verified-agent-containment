name: check

# Runs every check that does not need root: the Bend proofs, the kernel and
# host tests, clippy, the Rust/Bend/WebAssembly differential, the mutation
# check, the TLA+ model and the claims registry. The root attack and live
# suites are not run here; they stay a lab step recorded in claims.toml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new stable release cannot fail the -D warnings gate on its
  # own. Raise it deliberately, in a change that fixes any new lints.
  RUST_TOOLCHAIN: 1.100.0
  BEND_COMMIT: 0e2f38f759cc830849e489307f3d256a7d148288
  TLA_VERSION: v1.7.4
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  TLA2TOOLS: /opt/tla/tla2tools.jar

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tools/claims_check.py diffs each claim's files against its
          # recorded platform commit, so it needs the full history.
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
          rustc --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Bend (pinned)
        run: |
          git clone --quiet https://github.com/bendlang/bend "$RUNNER_TEMP/bend"
          git -C "$RUNNER_TEMP/bend" checkout --quiet "$BEND_COMMIT"
          test "$(git -C "$RUNNER_TEMP/bend" rev-parse HEAD)" = "$BEND_COMMIT"
          printf '#!/bin/sh\nexec bun %s/bend/bend2/main.ts "$@"\n' "$RUNNER_TEMP" | sudo tee /usr/local/bin/bend >/dev/null
          sudo chmod +x /usr/local/bin/bend

      - name: TLA+ tools (pinned, checksum verified)
        run: |
          sudo mkdir -p /opt/tla
          sudo curl -fsSL -o "$TLA2TOOLS" "https://github.com/tlaplus/tlaplus/releases/download/$TLA_VERSION/tla2tools.jar"
          echo "$TLA_SHA256  $TLA2TOOLS" | sha256sum --check

      # scripts/check.sh skips TLC silently when java or the jar is missing.
      # In CI a skip would read as a pass, so require every tool up front.
      - name: Require every tool check.sh uses
        run: |
          for tool in cargo bend bun node python3 java; do
            command -v "$tool" >/dev/null || { echo "::error::missing $tool"; exit 1; }
          done
          test -f "$TLA2TOOLS" || { echo "::error::missing $TLA2TOOLS"; exit 1; }

      - name: scripts/check.sh
        run: bash scripts/check.sh

      - name: Host tests
        run: cargo test -q -p containment-host

      # The sabotage feature does not exist on main yet. Once it does, the
      # sabotage build must also pass tests and clippy.
      - name: Host tests and clippy with the sabotage feature
        run: |
          if grep -q '^sabotage *=' crates/containment-host/Cargo.toml; then
            cargo test -q -p containment-host --features sabotage
            cargo clippy -q -p containment-host --all-targets --features sabotage -- -D warnings
          else
            echo "no sabotage feature in containment-host; skipped"
          fi
