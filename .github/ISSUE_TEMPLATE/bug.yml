name: Bug
description: Something behaves differently from what the docs or a claim say
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, platform and commit. Do not paste secrets.
    validations:
      required: true
  - type: input
    id: claims
    attributes:
      label: Claims this contradicts
      description: Claim ids from claims.toml, or "none". A bug that falsifies a claim is a security finding.
