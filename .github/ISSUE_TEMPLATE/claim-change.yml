name: Claim change
description: Add, strengthen, narrow or retire a row of claims.toml
title: "[claim] "
labels: ["claim-change"]
body:
  - type: input
    id: claim
    attributes:
      label: Claim id
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: The change
      description: The statement, status, evidence and files before and after.
    validations:
      required: true
  - type: textarea
    id: falsifier
    attributes:
      label: Falsifier
      description: What observation would show the claim is false, and which mutant, sabotage control or scenario demonstrates that the check can fail.
    validations:
      required: true
  - type: dropdown
    id: lab
    attributes:
      label: Does it need a root lab run?
      options: ["Yes", "No", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Design review outcome
      description: Who or what examined it, from which angles, and what they concluded.
