[workspace]
members = ["crates/containment-kernel", "crates/containment-host", "crates/containment-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Lints every crate inherits. Only lints the code already passes are listed, so
# adding them changes no source file. Stricter ones arrive with the formatting
# sweeps, which need fresh lab evidence. The kernel additionally forbids unsafe
# code as a crate attribute; the host and wasm crates need it.
[workspace.lints.rust]
unused_must_use = "deny"
# The Kani proofs are compiled under cfg(kani) (scripts/kani.sh).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
