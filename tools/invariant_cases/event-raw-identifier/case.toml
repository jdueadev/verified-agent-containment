checker = "invariants"
origin = "#120: a raw identifier for the variant (`r#Renew`)"
expect = "reject"
expect_error = "`control_handler` may name only HardRule, Tick, not `Event::Renew`"

[[replace]]
file = "crates/containment-host/src/controller/reset.rs"
old = '''let _ = shared.apply(None, received, |now_ms| Event::Tick { now_ms });'''
new = '''let _ = shared.apply(None, received, |now_ms| Event::r#Renew { now_ms, ttl_ms: 0 });'''
