[[claim]]
id = "H-S1-01"
statement = "Classifier liveness (a stall, a full queue, or a blind window) reaches the kernel only as Event::Classifier: Restrict on lag over 500 ms, Hold after a blind window with unscored events, never Freeze or Kill, and it never blocks lease renewal. Lag is tracked by sequence number; the episode re-arms when lag clears or after a reset; every gateway decision counts as unscored while blind."
layer = "host"
status = "tested"
evidence = ["scenario:classifier_stall", "scenario:classifier_blind", "scenario:blind_egress_only", "scenario:lag_after_reset", "scenario:flood_after_reset", "scenario:gateway_flood",
  "sabotage:classifier_beat_in_health", "sabotage:lag_episode_never_resets", "sabotage:untraced_decisions_ignored", "sabotage:overflow_latch_sticks", "sabotage:drop_overflow"]
falsifier = "A stalled classifier causes a denied renewal, Freeze or Kill; or a second stall after a reset goes unreported; or an agent dodges the blind-window Hold by not logging"
limits = "In-process lab classifier: a classifier crash aborts the controller (panic = abort), and the 'down for 30 s' rule is not implemented; both wait for the separate System One process (C-ISO-04). Lab blind window is 1.5 s; live is 60 s."
depends_on = ["K-CLS-01"]
platforms = [{ name = "linux-vm-6.18", commit = "f57ab0d", result = "pass" }]
files = ["crates/containment-host/src/controller.rs"]

[[claim]]
id = "H-CTL-02"
statement = "The operator control socket and the reset socket accept requests only from uid 0 in the controller's user namespace (SO_PEERCRED at connect time), even if their file mode is wrong: a non-root process is refused status, hard rules and a validly signed reset. The control socket cannot produce a classifier signal or a reset; the reset socket produces only Event::Reset."
layer = "host"
status = "tested"
evidence = ["scenario:control_from_other_uid", "scenario:signed_reset", "sabotage:control_peer_unchecked", "sabotage:reset_peer_unchecked"]
falsifier = "A request from a non-root uid changes the mode or is answered with ok"
limits = "Any uid 0 in the controller's namespace is the operator, including a root process that passes the connected fd on (SCM_RIGHTS) or a child that inherits it. The scenario covers a wrong socket mode with a traversable directory. The classifier's own channel is still in-process (C-ARCH-01, #4)."
platforms = [{ name = "linux-vm-6.18", commit = "f57ab0d", result = "pass" }]
files = ["crates/containment-host/src/controller.rs"]

