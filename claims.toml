# Claims table. Source of truth for docs/claims.md (generated by tools/claims_check.py).
# Schema: docs/design-spec.md and the council meeting of 2026-11-19.
#
# status:   proved | checked-bounded | tested | assumed | planned | stale
# evidence: law:<name> mutant:<bend mutant> rust-mutant:<name> scenario:<name> sabotage:<weakness>
#           diff:<rust-bend|rust-wasm> tla:<spec>#<property> doc:<file>#<text>
# files:    paths whose change after a platform commit makes the row stale (CI-4)
# depends_on: claim ids; a row's status may not be stronger than its weakest dependency (CI-5)

# ---------- Bend kernel: existing laws ----------

[[claim]]
id = "K-LEASE-01"
statement = "The kernel fails closed at the lease deadline in Run and Restrict."
layer = "bend-kernel"
status = "proved"
evidence = ["law:fail_closed", "mutant:expired_run_stays_live", "mutant:expired_restrict_stays_live"]
falsifier = "A state past its deadline that stays live"
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-LEASE-02"
statement = "Only renewal or an accepted reset extends a lease, and never beyond the maximum."
layer = "bend-kernel"
status = "proved"
evidence = ["law:renewal_is_bounded", "law:lease_only_renewal_extends", "mutant:renewal_ignores_maximum",
  "mutant:restrict_extends_lease", "mutant:repeated_restrict_extends", "mutant:agent_request_renews", "mutant:classifier_renews"]
falsifier = "A deadline extended by any other event, or beyond now + max"
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-TIME-01"
statement = "The kernel clock is exactly the event's effective time, and a stale timestamp cannot move it back."
layer = "bend-kernel"
status = "proved"
evidence = ["law:clock_never_rewinds", "law:clock_is_effective_time", "law:stale_time_uses_clock",
  "mutant:stale_time_accepted", "mutant:clock_not_sealed", "mutant:clock_jumps_forward"]
falsifier = "A clock that moves back or ahead of the effective time"
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-MONO-01"
statement = "Without an accepted reset, no event or sequence lowers containment, changes the counter, or emits a recovery action."
layer = "bend-kernel"
status = "proved"
evidence = ["law:tighten_only", "law:no_sequence_lowers_containment", "law:no_recovery_without_reset",
  "law:counter_needs_accepted_reset", "law:hard_rule_reaches_level", "law:kill_needs_accepted_reset",
  "mutant:restrict_can_lower", "mutant:hard_rule_ignored", "mutant:kill_signal_recovers", "mutant:hold_freeze_thaws",
  "mutant:freeze_repeat_restores", "mutant:events_zero_counter", "mutant:rejected_reset_burns_counter"]
falsifier = "An unsigned sequence that ends in a lower mode, a changed counter, or a thaw/rebuild/restore action"
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-CLS-01"
statement = "A classifier verdict cannot cause Kill or start the Freeze timer; it enters Hold at most, and Hold cannot escalate itself."
layer = "bend-kernel"
status = "proved"
evidence = ["law:classifier_cannot_kill", "law:classifier_stop_enters_hold", "law:hold_cannot_self_escalate",
  "mutant:classifier_can_kill", "mutant:classifier_can_start_freeze", "mutant:hold_expires_to_kill"]
falsifier = "Event::Classifier leading to Freeze or Kill"
limits = "Covers the Classifier constructor only. Classifier liveness reaches the kernel through renewal today; see C-S1-01."
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-PLAN-01"
statement = "Every stop revokes secrets and blocks egress before freezing or killing; Kill, Restrict and Freeze plans are complete; Freeze gets one fixed grace period and escalates."
layer = "bend-kernel"
status = "proved"
evidence = ["law:authority_removed_first", "law:stop_plan_is_complete", "law:kill_plan_is_complete",
  "law:restrict_plan_is_complete", "law:freeze_escalates", "law:freeze_deadline_is_fixed", "law:freeze_entry_uses_grace",
  "mutant:freeze_before_revocation", "mutant:empty_stop_plan", "mutant:stop_plan_never_freezes", "mutant:kill_plan_never_kills",
  "mutant:hold_kill_without_action", "mutant:freeze_kill_without_action", "mutant:freeze_never_escalates",
  "mutant:freeze_grace_ignored", "mutant:renewal_extends_freeze", "mutant:hold_freeze_far_deadline", "mutant:restrict_plan_empty"]
falsifier = "A stop plan missing an action or with FreezeCgroup before RevokeSecrets/BlockEgress"
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-RST-01"
statement = "A reset is accepted only if signed, with a fresh counter, matching mode and unexpired; it consumes the counter, cannot be replayed, gives a bounded lease and an exact recovery plan (Kill is rebuilt, never thawed)."
layer = "bend-kernel"
status = "proved"
evidence = ["law:reset_requires_signature", "law:reset_requires_fresh_counter", "law:reset_is_bound_to_mode",
  "law:reset_must_be_unexpired", "law:reset_cannot_renew_run", "law:accepted_reset_consumes_counter",
  "law:reset_cannot_replay", "law:reset_is_bounded", "law:reset_plan_is_complete",
  "mutant:unsigned_reset_runs", "mutant:reset_counter_replayable", "mutant:reset_not_bound_to_mode",
  "mutant:reset_never_expires", "mutant:reset_renews_run", "mutant:reset_counter_not_consumed",
  "mutant:reset_ignores_maximum", "mutant:kill_reset_thaws_survivors"]
falsifier = "An accepted reset missing any precondition, or a Kill recovery that thaws"
limits = "Fresh means greater than the counter, not exactly next; no bounded window. Superseded by C-KER-R1 in v3."
files = ["formal/kernel.bend", "formal/LAWS.bend"]

[[claim]]
id = "K-ACC-01"
statement = "Access requires a grant; an expired lease or a stopped mode denies it; Restrict denies secrets and non-baseline egress."
layer = "bend-kernel"
status = "proved"
evidence = ["law:access_requires_grant", "law:expired_lease_denies", "law:stopped_denies", "law:restrict_denies_secrets",
  "law:restrict_egress_needs_baseline", "mutant:expired_access_allowed", "mutant:access_uses_stale_time",
  "mutant:hold_allows_access", "mutant:freeze_allows_access", "mutant:restrict_allows_secret",
  "mutant:restrict_ignores_baseline", "mutant:access_ignores_grant"]
falsifier = "authorize returning true outside these conditions"
files = ["formal/kernel.bend", "formal/LAWS.bend"]

