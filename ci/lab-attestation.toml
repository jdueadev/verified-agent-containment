# What a CI lab run's OIDC token must say for its evidence to count (CI-10, #209).
# Read by tools/lab_attest.py and tools/claims_check.py. Trusted base: ci/**.

# This repository, by id: GitHub sets the token's repository_id, and the id stays the
# same when the repository moves to another owner (#207).
repository_id = "1464539531"
# The only workflow that may attest lab evidence, and the environment it runs in.
# Only main can deploy to `evidence` (#137), so a pull request cannot mint its token.
workflow = ".github/workflows/lab.yaml"
environment = "evidence"
# Refs whose push may produce evidence. Release candidate tags join this list when
# the lab moves to them (#206, part 2).
refs = ["refs/heads/main"]
# The token's audience is this prefix and the SHA-256 of the run's manifest.
audience_prefix = "lab-evidence:"
# Evidence committed before attestation existed. It keeps CI-3, CI-8 and CI-9 but has
# no token. Nothing is ever added here: new evidence must be attested.
legacy = [
  "results/ci/lab-9263878b598c472f65aa58b3116ed959323b98fa",
  "results/ci/lab-a38ad0086aec46c6b33229f43da52065e8c76e11",
]
