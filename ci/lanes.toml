# Merge lanes. The authority for which changes need the maintainer.
# Read by tools/policy_check.py; .github/CODEOWNERS is generated from lane C.
#
# A path takes the lane of the first pattern it matches, checking C, then B,
# then A. A path that matches nothing is lane C. A pull request takes the
# highest lane of any path it touches, and a ratchet (see policy_check.py)
# can raise it to C whatever the paths say.
#
#   A  free                merges on a green `check`
#   B  evidence-carrying   also needs the ratchets and the evidence checks to hold
#   C  trusted base        also needs the maintainer's approval
#
# Patterns: an exact file, `dir/**` for everything under a directory, or a
# single `*` inside one file name. Keep them that simple: CODEOWNERS has to
# express the same set.

owner = "@jdueadev"

# Authors whose lane C changes merge without the owner's approval (#206). The
# owner and the agents the project runs are trusted; outside collaborators are
# not. `policy` reads this list from the target branch, so a change cannot add
# its own author. A fork always needs the owner, whoever opened it.
trusted = ["@jdueadev", "@jdueadev-agent", "@vac-agent-app[bot]", "@vac-lab-runner[bot]"]

[lanes]
C = [
  # The rules and the machinery that enforces them.
  ".github/**",
  "ci/**",
  "scripts/**",
  ".gitattributes",
  # Steers what the automated reviewer looks at, and how closely.
  ".coderabbit.yaml",
  # Claude Code reads these as settings, hooks, skills, agent prompts and session
  # handovers. Settings and hooks run on the machine of whoever opens a session in
  # the checkout, and the rest steers the next agent session (#169).
  ".claude/**",
  "AGENTS.md",
  "CLAUDE.md",
  "docs/decisions/**",
  # Verifiers: a change to a checker is a change to the proof.
  "tools/claims_check.py",
  "tools/policy_check.py",
  # Runs the base branch's spec against a head checkout (#125).
  "tools/spec_run.py",
  # Runs the known-bad corpus in ci/corpus/ against a head checkout (#125).
  "tools/corpus_run.py",
  "tools/pins_check.py",
  # Keeps secrets in main-only environments and event text out of scripts (#137).
  "tools/workflow_lint.py",
  # Turns the required workflows' results into gate App check runs (#137, stage 2).
  "tools/gate_check.py",
  "tools/rust_tokens.py",
  "tools/mutation_check.py",
  "tools/differential.mjs",
  "tools/wasm_check.mjs",
  "tools/law_audit.mjs",
  "tools/tla_check.sh",
  "tools/generate_proof.py",
  # After-the-fact audit of merges to main (#54, #71).
  "tools/merge_digest.py",
  # A no-root driver (#180). It starts commands as the person who runs it, so it
  # is trusted base, listed by name rather than left to the unlisted default.
  "tools/vac.py",
  "tools/vac_core.py",
  "tools/vac_rules.py",
  "tools/results_ratchet.py",
  # Writes lab evidence from a CI run (#53).
  "tools/lab_record.py",
  # Attests and verifies CI lab evidence (CI-10, #209): what makes lab output authentic.
  "tools/lab_attest.py",
  # The attack harness, live suite and red-team runner decide what "passed"
  # means. Weakening an assertion keeps its name, so no ratchet can see it;
  # these files need the maintainer until stage 3 of #125 judges them from
  # outside the host.
  "crates/containment-host/src/harness.rs",
  "crates/containment-host/src/live_suite.rs",
  "crates/containment-host/src/redteam.rs",
  # Host containment code, and the inputs that can change the shipped binary
  # without touching it. The lab gates honest mistakes, but the code under test
  # can fool the lab, so these need the maintainer (#83). Every host source
  # file but one is listed by a host lab claim.
  "crates/containment-host/**",
  ".cargo/**",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  # The kernel is compiled into the host. Its source stays lane B (laws,
  # mutants and the differential test it), but a build script or a new
  # dependency runs code during the host build.
  "crates/containment-kernel/Cargo.toml",
  "crates/containment-kernel/build.rs",
  # The wasm build runs in `check` before the wasm differential judges it.
  "crates/containment-wasm/Cargo.toml",
  "crates/containment-wasm/build.rs",
  # Evidence that CI does not regenerate: the root lab runs and the Lean recheck.
  "results/attack-suite*",
  "results/live-suite*",
  "results/linux-vm/**",
  "results/wsl2/**",
  "results/ci/**",
  "results/redteam/**",
  "results/formal-verdict.json",
]
B = [
  "crates/**",
  "formal/**",
  "rustfmt.toml",
  "clippy.toml",
  "claims.toml",
  "docs/claims.md",
  "docs/design-spec.md",
  "docs/evidence.md",
  "docs/verification.md",
  "README.md",
  "tools/kernel_mutants.py",
  # Spec: the tool tests and the kernel law tests (#125, stage 2). A new file
  # merges without the maintainer once `spec` judges it from the base branch
  # and finds the base spec still passing. An existing file is immutable: the
  # spec ratchet in policy_check.py sends any edit, removal or rename to lane C.
  # crates/containment-kernel/tests/** is covered by crates/** above.
  "tools/test_*.py",
  "redteam/**",
  # Results that `scripts/check.sh` regenerates on every CI run.
  "results/**",
]
A = [
  "docs/**",
  "web/**",
  "examples/**",
  "CONTRIBUTING.md",
  ".gitignore",
  "tools/page_check.py",
]
