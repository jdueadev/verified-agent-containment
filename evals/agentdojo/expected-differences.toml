# Differences between two AgentDojo runs that are meant, each with its reason.
# tools/eval_diff.py reads this file and fails on every fingerprint it does not
# cover. An entry is a decision that a difference is intended, not a bug, so it
# needs the owner's approval in review, like a change to claims.toml.
#
# Each field is matched as a glob; before and after are matched against the
# JSON of the value (a string keeps its quotes).
#
# [[expected]]
# suite = "workspace"
# stage = "gate on injection send_email"
# before = '"allowed"'
# after = '"refused (*)"'
# reason = "email is granted by address, not by domain"
