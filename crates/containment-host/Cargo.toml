[package]
name = "containment-host"
description = "Linux host controller and attack harness for agent containment"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "containment-lab"
path = "src/main.rs"

[features]
default = []
# Compiles in the deliberate defects that the attack and live suites must catch.
# Never enable it for a binary that contains a real agent.
sabotage = []

[dependencies]
containment-kernel = { path = "../containment-kernel" }
ed25519-dalek = "3"
hmac = "0.13"
libc = "0.2"
serde_json = "1"
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
