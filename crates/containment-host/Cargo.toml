[package]
name = "containment-host"
description = "Linux host controller and attack harness for agent containment"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "containment-lab"
path = "src/main.rs"

[dependencies]
containment-kernel = { path = "../containment-kernel" }
ed25519-dalek = "2"
hmac = "0.12"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
